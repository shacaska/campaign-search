name: Probe (diagnostics)
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1
      - name: Probe with real Chrome
        run: xvfb-run -a node scripts/probe-browser.mjs
      - name: Save results
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rq --cached .
          git add -f probe-out
          git commit -qm "probe results $GITHUB_RUN_ID"
          git push -f origin probe-results
