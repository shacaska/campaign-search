name: Probe (diagnostics)
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        env:
          PROBE_URLS: >-
            https://www.kickstarter.com/projects/kingdomsforlorn/aeon-trespass-odyssey-second-printing
            https://gamefound.com/en/projects/earthborne-games/hubworld-aidalon/updates
            https://gamefound.com/en/projects/earthborne-games/hubworld-aidalon
        run: node scripts/probe.mjs
      - name: Save results
        run: |
          git config user.name "probe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rq --cached .
          git add -f probe-out
          git commit -qm "probe results $GITHUB_RUN_ID"
          git push -f origin probe-results
